morning_turn_on_tv:
  alias: Morning - Turn On TV
  mode: single
  description: >-
    Wake the onn 4K Plus, launch Nuvio, and normalize the HDMI ARC soundbar volume to 30.
  sequence:
    - alias: Wake onn 4K Plus
      action: remote.turn_on
      target:
        entity_id: remote.onn_4k_plus
      data: {}

    - alias: Give the TV, soundbar, and streamer time to wake up and synchronize
      delay:
        seconds: 10

    - alias: Launch Nuvio
      action: remote.turn_on
      target:
        entity_id: remote.onn_4k_plus
      data:
        activity: "nuvio://"

    - alias: Normalize soundbar volume to 0
      repeat:
        count: 50
        sequence:
          - action: remote.send_command
            target:
              entity_id: remote.onn_4k_plus
            data:
              command: VOLUME_DOWN
              delay_secs: 0.4

    - alias: Raise soundbar volume to 30
      repeat:
        count: 15
        sequence:
          - action: remote.send_command
            target:
              entity_id: remote.onn_4k_plus
            data:
              command: VOLUME_UP
              delay_secs: 0.4
