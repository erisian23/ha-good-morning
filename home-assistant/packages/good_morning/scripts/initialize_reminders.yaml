morning_initialize_reminders:
  alias: Morning - Initialize Reminders
  mode: single
  icon: mdi:calendar-clock
  sequence:
    # Initialize the optional reminder system if it is installed.
    - if:
        - condition: template
          value_template: >-
            {{
              states('script.reminders_initialize')
              not in ['unknown', 'unavailable']
            }}
      then:
        - action: script.reminders_initialize
